services:
  - type: web
    name: instalador-mlr-odoo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 180
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    # Para conservar el catalogo y conexiones entre reinicios, agrega un disco (opcional):
    # disk:
    #   name: datos
    #   mountPath: /var/data
    #   sizeGB: 1
